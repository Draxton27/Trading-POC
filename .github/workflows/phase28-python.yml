name: Phase 28 Python

on:
  pull_request:
    paths:
      - 'ml/phase28/**'
      - 'ml/phase31/**'
      - 'ml/phase41b/**'
      - 'ml/phase41c/**'
      - 'ml/phase41d/**'
      - 'ml/phase41e/**'
      - 'ml/phase41f/**'
      - 'ml/phase41g/**'
      - 'ml/phase41h/**'
      - 'docs/phase41d-target-protocol.md'
      - 'docs/phase41e-candle-market-structure.md'
      - 'docs/phase41f-target-feature-comparison.md'
      - 'docs/phase41g-investep-trend-events.md'
      - 'docs/phase41h-sma-rejection-continuation.md'
      - 'trading_poc_001_bollinger/src/phase41b-*.ts'
      - 'trading_poc_001_bollinger/src/phase41e-*.ts'
      - 'trading_poc_001_bollinger/src/phase41g-*.ts'
      - 'scripts/ml-train.mjs'
      - 'scripts/ml-infer.mjs'
      - 'trading_poc_001_bollinger/src/phase31-*.ts'
      - '.github/workflows/phase28-python.yml'
  workflow_dispatch:

jobs:
  phase28-python:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          architecture: 'x64'
      - name: Install prebuilt wheels only
        run: 'python -m pip install --only-binary=:all: -r ml/phase40c2/requirements.txt'
      - name: Run synthetic XGBoost tests
        run: python -m unittest ml.phase28.test_train ml.phase31.test_infer ml.phase41b.test_bear_audit ml.phase41c.test_target_audit ml.phase41d.test_targets ml.phase41e.test_features ml.phase41f.test_experiment ml.phase41g.test_events ml.phase41h.test_rejections
