name: Phase 28 Python

on:
  pull_request:
    paths:
      - 'ml/phase28/**'
      - 'ml/phase31/**'
      - 'scripts/ml-train.mjs'
      - 'scripts/ml-infer.mjs'
      - 'trading_poc_001_bollinger/src/phase31-*.ts'
      - '.github/workflows/phase28-python.yml'
  workflow_dispatch:

jobs:
  phase28-python:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          architecture: 'x64'
      - name: Install prebuilt wheels only
        run: 'python -m pip install --only-binary=:all: -r ml/phase28/requirements.txt'
      - name: Run synthetic XGBoost tests
        run: python -m unittest ml.phase28.test_train ml.phase31.test_infer
