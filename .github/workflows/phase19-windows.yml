name: Phase 19 Windows
on:
  pull_request:
    paths:
      - 'apps/**'
      - 'packages/**'
      - 'scripts/windows/**'
      - 'scripts/dev.mjs'
      - 'scripts/ml-train.mjs'
      - 'scripts/ml-infer.mjs'
      - 'ml/**'
      - 'trading_poc_001_bollinger/src/phase31-*.ts'
      - 'trading_poc_001_bollinger/src/phase32-*.ts'
      - 'trading_poc_001_bollinger/src/alpaca*.ts'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/phase19-windows.yml'
jobs:
  windows:
    runs-on: windows-latest
    strategy:
      matrix:
        node-version: ['22', '24']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: Probar npm run dev, puertos y cierre en Windows
        shell: pwsh
        run: ./scripts/windows/dev-smoke.ps1
  phase28-python:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          architecture: 'x64'
      - run: 'python -m pip install --only-binary=:all: -r ml/phase28/requirements.txt'
      - run: python -m unittest ml.phase28.test_train
      - run: python -m unittest ml.phase31.test_infer
