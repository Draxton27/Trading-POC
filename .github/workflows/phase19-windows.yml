name: Phase 19 Windows
on:
  pull_request:
    paths:
      - 'apps/**'
      - 'packages/**'
      - 'scripts/windows/**'
      - 'scripts/daily-orchestrator.ts'
      - 'scripts/iex-daily.ts'
      - 'scripts/iex-diagnostics.ts'
      - 'docs/phase40d1-iex-readiness.md'
      - 'tests/phase19/iex-diagnostics.test.ts'
      - 'docs/daily-automation.md'
      - 'scripts/dev.mjs'
      - 'scripts/ml-train.mjs'
      - 'scripts/ml-infer.mjs'
      - 'scripts/ml-observe.mjs'
      - 'scripts/ml-collect.mjs'
      - 'scripts/ml-evaluate.mjs'
      - 'apps/api/src/news/**'
      - 'apps/web/src/features/news/**'
      - 'packages/contracts/src/news.ts'
      - 'tests/phase19/news.test.ts'
      - 'tests/phase19-e2e/news.spec.ts'
      - 'vitest.config.ts'
      - 'ml/**'
      - 'docs/phase41c-bear-target-audit.md'
      - 'docs/phase41d-target-protocol.md'
      - 'trading_poc_001_bollinger/src/phase31-*.ts'
      - 'trading_poc_001_bollinger/src/phase32-*.ts'
      - 'trading_poc_001_bollinger/src/phase34-*.ts'
      - 'trading_poc_001_bollinger/src/phase35-*.ts'
      - 'trading_poc_001_bollinger/src/phase38-*.ts'
      - 'trading_poc_001_bollinger/src/phase38b-*.ts'
      - 'trading_poc_001_bollinger/src/phase38c-*.ts'
      - 'trading_poc_001_bollinger/src/phase38d-*.ts'
      - 'trading_poc_001_bollinger/src/phase38e-*.ts'
      - 'trading_poc_001_bollinger/src/phase38f-*.ts'
      - 'ml/phase38e/**'
      - 'ml/phase38f/**'
      - 'scripts/ml-iex-replay.mjs'
      - 'tests/phase19/iex-history.test.ts'
      - 'tests/phase19/iex-walk-forward.test.ts'
      - 'trading_poc_001_bollinger/tests/phase38f-*.test.ts'
      - 'tests/phase19/ml-historical-replay.test.ts'
      - 'tests/phase19/ml-post-decision-replay.test.ts'
      - 'scripts/ml-replay.mjs'
      - 'scripts/ml-post-replay.mjs'
      - 'tests/phase19/iex-live.test.ts'
      - 'tests/phase19/iex-daily.test.ts'
      - 'tests/phase19/daily-automation.test.ts'
      - 'apps/api/src/ml/news-context*.ts'
      - 'apps/web/src/features/ml/NewsContextView.tsx'
      - 'tests/phase19/ml-news-context.test.ts'
      - 'trading_poc_001_bollinger/src/alpaca*.ts'
      - 'trading_poc_001_bollinger/src/investep-technical-context.ts'
      - 'trading_poc_001_bollinger/src/phase41b-*.ts'
      - 'trading_poc_001_bollinger/src/phase41e-*.ts'
      - 'trading_poc_001_bollinger/src/phase41g-*.ts'
      - 'tests/phase19/phase41e-*.test.ts'
      - 'docs/phase41e-candle-market-structure.md'
      - 'docs/phase41f-target-feature-comparison.md'
      - 'docs/phase41g-investep-trend-events.md'
      - 'tests/phase19/technical-context.test.ts'
      - 'tests/phase19/phase41b-context.test.ts'
      - 'docs/phase41a-investep-technical-context.md'
      - 'docs/phase41b-sip-investep-bear-audit.md'
      - 'tests/phase19/ml-collector.test.ts'
      - 'tests/phase19/ml-forward-evaluation.test.ts'
      - 'tests/phase19-e2e/ml.spec.ts'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/phase19-windows.yml'
jobs:
  windows:
    runs-on: windows-latest
    strategy:
      matrix:
        node-version: ['22', '24']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: Probar npm run dev, puertos y cierre en Windows
        timeout-minutes: 5
        shell: pwsh
        run: ./scripts/windows/dev-smoke.ps1
  phase28-python:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          architecture: 'x64'
      - run: 'python -m pip install --only-binary=:all: -r ml/phase40c2/requirements.txt'
      - run: python -m unittest ml.phase28.test_train
      - run: python -m unittest ml.phase31.test_infer
      - run: python -m unittest ml.phase38b.test_replay
      - run: python -m unittest ml.phase38c.test_replay
      - run: python -m unittest ml.phase38e.test_replay
      - run: python -m unittest ml.phase38f.test_phase38f
      - run: python -m unittest ml.phase40a.test_bear_audit
      - run: python -m unittest discover -s ml/phase40b -p "test_*.py"
      - run: python -m unittest discover -s ml/phase40c1 -p "test_*.py"
      - run: python -m unittest discover -s ml/phase40c2 -p "test_*.py"
      - run: python -m unittest ml.phase41b.test_bear_audit
      - run: python -m unittest ml.phase41c.test_target_audit
      - run: python -m unittest ml.phase41d.test_targets
      - run: python -m unittest ml.phase41e.test_features
      - run: python -m unittest ml.phase41f.test_experiment
      - run: python -m unittest ml.phase41g.test_events
      - run: python -m unittest ml.phase41h.test_rejections
